<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.page_type == 'home' %}xiyu.news · 每日加密与 AI 日报{% else %}{{ page.title | escape }} · xiyu.news{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
{% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
{% if page.redirect_to %}<meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}"><link rel="canonical" href="{{ page.redirect_to | absolute_url }}">{% else %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
<link rel="alternate" type="application/rss+xml" title="xiyu.news 日报" href="/feed.xml">
<meta name="color-scheme" content="light dark"><meta name="theme-color" content="#f4f5f7">
<link rel="icon" href="{{ '/assets/images/app-icon.svg' | relative_url }}" type="image/svg+xml">
<script>try{var t=localStorage.getItem('xiyu-core-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="{{ '/assets/css/core.css' | relative_url }}?v={{ site.asset_version }}">
<script defer src="{{ '/assets/js/core.js' | relative_url }}?v={{ site.asset_version }}"></script>
</head>
<body class="core-site dense-site {{ page.page_class }}">
<a class="skip-link" href="#content">跳到正文</a>
<header class="site-header"><div class="header-inner">
<a class="brand" href="{{ '/' | relative_url }}" aria-label="xiyu.news 首页">{% include brand-mark.html %}<strong>xiyu.news</strong></a>
<nav class="site-nav" aria-label="主导航">
  <button class="directory-jump" type="button" aria-controls="edition-directory" hidden>目录</button>
  <a href="{{ '/' | relative_url }}"{% if page.page_type == 'home' %} aria-current="page"{% elsif page.lang %} class="is-current"{% endif %}>信息流</a>
</nav>
<button class="theme-toggle" type="button" aria-label="切换深色模式" hidden>◐</button>
</div></header>
<main id="content" class="reader{% if page.page_type != 'home' and page.lang == nil %} reader-prose{% endif %}" tabindex="-1">
{% if page.lang %}
  {% include reader-masthead.html %}
  {% include edition-reader.html edition=page body=content %}
{% else %}
  {{ content }}
{% endif %}
</main>
<footer class="site-footer">
  <nav aria-label="页脚">
    <a href="https://x.com/ohxiyu">关注 @ohxiyu</a>
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    <a href="{{ '/legal/' | relative_url }}">版权与来源</a>
  </nav>
</footer>
<p class="copy-status" role="status" aria-live="polite"></p>
</body></html>
