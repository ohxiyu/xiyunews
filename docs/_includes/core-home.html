{% assign posts = site.posts | where: 'lang', 'zh' %}
{% assign latest = posts | first %}
{% include reader-masthead.html home=true %}
{% if latest %}
  <p class="edition-status" data-edition-status hidden><strong>今日版尚未发布</strong><span>下方显示最近一期日报。</span></p>
  {% include edition-reader.html edition=latest latest=true body=latest.content %}
{% else %}
  <p class="empty-state">首期日报发布后将在这里显示。</p>
{% endif %}
