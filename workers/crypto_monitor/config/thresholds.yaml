# QweCryptoMonitor Configuration
# 3-Minute Change Alert System

# Alert Settings
alerts:
  cooldown_seconds: 7200       # 2 hour cooldown between same symbol alerts (was 3600)
  max_batch_size: 10           # Max messages per batch
  batch_window_seconds: 2.0    # Aggregation window in seconds

# 3-Minute Change Alert Configuration
change3m_alert:
  enabled: true
  scan_interval_seconds: 60    # Main scan loop frequency (seconds)
  group_refresh_seconds: 600   # Group refresh frequency (10 minutes)
  max_concurrent_requests: 20  # Max concurrent API requests

  # Alert thresholds by market and volume group
  # Volume groups are based on ABSOLUTE 24h quote volume (not percentile)
  thresholds:
    # Spot Market:
    #   HIGH: > $100M
    #   MID:  $10M - $100M
    #   LOW:  $500k - $10M
    spot_high: 5     # 5% threshold for > $100M volume (was 3)
    spot_mid: 12     # 12% threshold for $10M - $100M volume (was 8)
    spot_low: 20     # 20% threshold for $500k - $10M volume (was 15)

    # Futures Market:
    #   HIGH: > $200M
    #   MID:  $10M - $200M
    #   LOW:  $500k - $10M
    futures_high: 8   # 8% threshold for > $200M volume (was 5)
    futures_mid: 20   # 20% threshold for $10M - $200M volume (was 15)
    futures_low: 40   # 40% threshold for $500k - $10M volume (was 30)
