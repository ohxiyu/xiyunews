# fomobtc.com has no web page: every request goes to the Telegram group (302, so the
# invite link can be replaced later). Its certificate must exist before port 443 loads:
# certbot certonly --webroot -w /var/www/fomobtc-acme --cert-name fomobtc.com \
#   -d fomobtc.com -d www.fomobtc.com
server {
    listen 80;
    server_name fomobtc.com www.fomobtc.com;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/fomobtc-acme; }
    location / { return 302 https://t.me/+mdTufn9GK1UyODk0; }
}
server {
    listen 443 ssl;
    server_name fomobtc.com www.fomobtc.com;
    ssl_certificate /etc/letsencrypt/live/fomobtc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fomobtc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    location / { return 302 https://t.me/+mdTufn9GK1UyODk0; }
}
