# Install in /etc/nginx/sites-available/fomobtc after issuing the certificate.
# api.xiyu.news is primary; api.fomobtc.com stays available during migration.
# Both API hostnames are DNS-only: client IPs reach nginx directly.
limit_req_zone $binary_remote_addr zone=fomobtc_requests:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=fomobtc_clients:1m;
limit_conn_zone $server_name zone=fomobtc_total:1m;
server {
    listen 80;
    server_name api.fomobtc.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/fomobtc-acme; }
    location / { return 308 https://api.fomobtc.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name api.fomobtc.com;
    ssl_certificate /etc/letsencrypt/live/api.fomobtc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.fomobtc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FomoBTC:1m;
    server_tokens off;
    client_max_body_size 1k;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    limit_req_status 429;
    limit_conn_status 429;
    location /api/ {
        limit_except GET OPTIONS { deny all; }
        limit_req zone=fomobtc_requests burst=20 nodelay;
        limit_conn fomobtc_clients 5;
        limit_conn fomobtc_total 80;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security 'max-age=31536000' always;
    }
    location / { return 404; }
}

