<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.page_type == 'home' %}xiyu.news · 读懂正在发生的事{% else %}{{ page.title | escape }} · xiyu.news{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">
{% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
{% if page.redirect_to %}<meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}"><link rel="canonical" href="{{ page.redirect_to | absolute_url }}">{% else %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
<meta name="color-scheme" content="light dark"><meta name="theme-color" content="#f7f8fa">
<link rel="icon" href="{{ '/assets/images/app-icon.svg' | relative_url }}" type="image/svg+xml">
<script>try{var t=localStorage.getItem('xiyu-core-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="{{ '/assets/css/core.css' | relative_url }}?v={{ site.asset_version }}">
<script defer src="{{ '/assets/js/core.js' | relative_url }}?v={{ site.asset_version }}"></script>
</head>
<body class="core-site {{ page.page_class }}">
<a class="skip-link" href="#content">跳到正文</a>
<header class="site-header"><div class="header-inner">
<a class="brand" href="/" aria-label="xiyu.news 首页"><span class="brand-symbol" aria-hidden="true">稀</span><strong>xiyu<span>.news</span></strong></a>
<nav aria-label="主导航"><a href="/" {% if page.page_type == 'home' or page.lang %}aria-current="page"{% endif %}>日报</a><a href="/threads/" {% if page.url contains '/threads/' or page.url contains '/events/' %}aria-current="page"{% endif %}>事件流</a><a href="/history/" {% if page.url == '/history/' %}aria-current="page"{% endif %}>往期</a></nav>
<button class="theme-toggle" type="button" aria-label="切换深色模式" hidden>◐</button>
</div></header>
<main id="content" class="reader" tabindex="-1">
{% if page.lang %}<header class="page-heading"><p class="eyebrow">往期日报 · {{ page.date | date: '%Y.%m.%d' }}</p><h1>这一期，值得知道的事</h1></header><section class="daily-day" data-language="zh" data-date="{{ page.date | date: '%Y-%m-%d' }}">{{ content }}</section><p class="archive-back"><a href="/history/">浏览其他日期</a></p>{% else %}{{ content }}{% endif %}
</main>
<footer class="site-footer"><a href="/">xiyu.news</a><p>加密 · AI · 政策</p><a href="/about/">关于与来源说明</a></footer>
<p class="copy-status" role="status" aria-live="polite"></p>
</body></html>
