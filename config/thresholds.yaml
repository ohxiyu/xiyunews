# FomoBTC alert policy (src/platform).

market_alerts:
  # Binance spot universe and volume groups are refreshed this often.
  universe_refresh_seconds: 600
  burst:
    confirmation_ms: 3000
    cooldown_seconds: 900
    thresholds:
      high: {60: 1.5, 180: 2.5}
      mid: {60: 2.5, 180: 4.0}
      low: {60: 4.0, 180: 6.0}
  trend:
    change_6h: 5.0
    change_24h: 8.0
    edge_fraction: 0.1
    cooldown_seconds: 21600
  # Telegram only: notices due together are sent as one message. The web keeps one
  # event per symbol. hold_seconds delays each notice so candle-close trends cluster.
  # On-chain Binance inflows/outflows (src/platform/flows.py).
  flows:
    threshold_usd: 10000000
  digest:
    hold_seconds: 3
    max_items: 30
    market_wide_symbols: 4
