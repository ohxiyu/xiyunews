name: xiyunews Event Updates
on:
  schedule:
    - cron: '10 */4 * * *'
  workflow_dispatch:
concurrency:
  group: xiyunews-event-updates
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  events:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.XIYUNEWS_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: published
          persist-credentials: false
      - name: Restore event and public evidence snapshot
        run: |
          cp -a published/_data/. docs/_data/
          git fetch --depth=1 origin staging-cache
          git show FETCH_HEAD:data/staging-items.json > data/staging-items.json
          git show FETCH_HEAD:data/analysis-cache.json > data/analysis-cache.json
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.32'
      - run: uv sync --frozen
      - name: Update events outside daily publication lock
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: uv run python -m src.core_events
      - name: Retain event health report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: event-report-${{ github.run_id }}
          path: data/run-report.json
      - uses: actions/upload-artifact@v6
        with:
          name: event-output
          path: event-output
          include-hidden-files: true
  publish:
    needs: events
    concurrency:
      group: bmtnews-feed-update
      cancel-in-progress: false
    runs-on: ${{ fromJSON(vars.XIYUNEWS_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/download-artifact@v7
        with:
          name: event-output
          path: event-output
      - name: Publish only event assets under the shared publication lock
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./event-output
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: true
          commit_message: 'Event updates: ${{ github.run_id }}'
      - name: Acknowledge only the exact published event snapshot
        run: python3 -m src.core_event_checkpoint
