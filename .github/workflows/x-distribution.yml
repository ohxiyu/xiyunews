name: xiyu.news X Distribution

# Avoid the observed HTTP/2 CANCEL/early-EOF downloads. Process-local only;
# never change server Git config or credentials.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1
  XIYUNEWS_STATE_BACKEND: ${{ vars.XIYUNEWS_RUNTIME_MODE == 'hosted' && 'cloudflare' || '' }}

# Posts today's top stories to X from a plan that is written before anything
# is sent (src/x_queue.py). Only runs when x_delivery.mode is "drip" and the
# credentials are configured; otherwise every run exits without posting.
#
# A successful Cloudflare deployment wakes this workflow; an exact daily
# producer proof and the current public pages must match before any post. Later runs only poll: a cheap stdlib gate reads
# the queue and the published edition state and exits in seconds unless a
# post is due, the edition changed, or a deadline passed. Each run sends at
# most one post, and an outcome that cannot be proven is never retried.

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Read-only account and public channel verification; never post or mutate queue
        type: boolean
        default: false
  workflow_run:
    workflows: ['xiyunews Cloudflare']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 23,0-15 * * *'

concurrency:
  group: bmtnews-x-distribution
  cancel-in-progress: false

permissions:
  contents: write  # Existing durable queue checkpoints only
  actions: read  # Read exact trusted publication artifacts
  id-token: write

jobs:
  post:
    if: >-
      vars.XIYUNEWS_RUNTIME_MODE != 'maintenance' &&
      ((github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)) &&
      (inputs.verify_only || vars.X_DELIVERY_ENABLED != 'false')
    runs-on: ${{ vars.XIYUNEWS_RUNTIME_MODE == 'hosted' && 'ubuntu-latest' || fromJSON(vars.XIYUNEWS_RUNNER_LABELS || '["ubuntu-latest"]') }}
    # Cold source checkout can exceed eight minutes on this runner. Preserve
    # time for checkpointing; business deadlines remain enforced by x_queue.
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      X_DELIVERY_ENABLED: ${{ vars.X_DELIVERY_ENABLED }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main # Never run another branch's code against the live account.
          filter: blob:none
          sparse-checkout: |
            src
            data
            scripts

      - name: Acquire private fenced publication state
        id: state
        if: env.XIYUNEWS_STATE_BACKEND == 'cloudflare' && !inputs.verify_only
        run: python3 -m src.edge_state acquire

      - name: Restore published edition state
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Read the one private audit file, not the entire publication tree.
          # Network/auth/invalid content fails closed, never an empty edition.
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/_data/bmtnews_state.json?ref=gh-pages" \
            > "$RUNNER_TEMP/x-edition.json"
          python3 -c 'import json,sys; value=json.load(open(sys.argv[1])); sys.exit(0 if isinstance(value,dict) and isinstance(value.get("items"),list) and isinstance(value.get("date"),str) else "Invalid published edition")' "$RUNNER_TEMP/x-edition.json"
          mkdir -p docs/_data
          cp "$RUNNER_TEMP/x-edition.json" docs/_data/bmtnews_state.json

      - name: Restore isolated delivery queue
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git init "$RUNNER_TEMP/x-state"
          git -C "$RUNNER_TEMP/x-state" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$RUNNER_TEMP/x-state" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/x-state" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Network/auth errors must not be read as an empty queue: that
          # would forget what was already sent and post it again.
          refs=$(git ls-remote --heads origin refs/heads/x-queue)
          if [ -n "$refs" ]; then
            git -C "$RUNNER_TEMP/x-state" fetch --depth=1 origin x-queue
            git -C "$RUNNER_TEMP/x-state" checkout -b x-queue FETCH_HEAD
            test -f "$RUNNER_TEMP/x-state/data/x-queue.json"
          else
            git -C "$RUNNER_TEMP/x-state" checkout --orphan x-queue
          fi

      - name: Queue gate (no dependencies)
        if: ${{ !inputs.verify_only }}
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m src.x_queue \
            --queue "$RUNNER_TEMP/x-state/data/x-queue.json" \
            --feed-state docs/_data/bmtnews_state.json \
            --config data/config.github.json | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        if: inputs.verify_only || steps.gate.outputs.work == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        if: inputs.verify_only || steps.gate.outputs.work == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - name: Install dependencies
        if: inputs.verify_only || steps.gate.outputs.work == 'true'
        run: uv sync --frozen

      - name: Prepare GitHub Actions config
        if: inputs.verify_only || steps.gate.outputs.work == 'true'
        run: cp data/config.github.json data/config.json

      - name: Verify the existing account without posting
        if: inputs.verify_only
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: uv run python -m src.x_verification --account-only

      - name: Find exact production proof for the saved edition
        if: steps.gate.outputs.work == 'true'
        id: proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m src.x_verification

      - name: Plan and send with remote checkpoints
        if: steps.proof.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # One bounded composition task; invalid text is skipped, never templated.
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID || vars.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_ALERT_THREAD_ID: ${{ secrets.TELEGRAM_ALERT_THREAD_ID || vars.TELEGRAM_ALERT_THREAD_ID }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--mode x-post --x-queue-dir "$RUNNER_TEMP/x-state")
          uv run bmtnews "${args[@]}"

      - name: Flag posts that need a person
        if: steps.proof.outputs.ready == 'true'
        run: |
          uv run python - <<'PYQUEUE'
          import os
          from pathlib import Path
          from src.x_queue import load, attention
          path = Path(os.environ['RUNNER_TEMP']) / 'x-state/data/x-queue.json'
          if attention(load(path)):
              raise SystemExit('X queue needs review: pending, unknown or failed delivery. See project-docs/x-distribution.md.')
          PYQUEUE


      - name: Record costs and operational failure outcome
        if: ${{ always() && (steps.proof.outputs.ready == 'true' || (failure() && (inputs.verify_only || steps.gate.outputs.work == 'true'))) }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID || vars.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_ALERT_THREAD_ID: ${{ secrets.TELEGRAM_ALERT_THREAD_ID || vars.TELEGRAM_ALERT_THREAD_ID }}
          OPERATIONS_STATUS: ${{ job.status }}
        run: uv run python -m src.operations --workflow-status "$OPERATIONS_STATUS"

      - name: Publish run report
        if: ${{ always() && (inputs.verify_only || steps.gate.outputs.work == 'true') }}
        shell: bash
        run: |
          if [ -f data/run-report.json ]; then
            python3 -m src.run_report --input data/run-report.json --output "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep machine-readable cost and health report
        if: ${{ always() && (inputs.verify_only || steps.gate.outputs.work == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: run-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/run-report.json
            data/x-verification.json
          retention-days: 30
          if-no-files-found: warn

      - name: Release private publication state
        if: always() && steps.state.outcome == 'success'
        run: python3 -m src.edge_state release

