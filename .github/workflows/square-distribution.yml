name: xiyu.news Binance Square Distribution

# Avoid the observed HTTP/2 CANCEL/early-EOF downloads. Process-local only;
# never change server Git config or credentials.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1

on:
  # Existing production flows provide an independent trigger if this cron is dropped.
  workflow_run:
    # Not 'xiyu.news X Distribution': X is triggered by this workflow's completion.
    workflows: ['xiyu.news Daily Edition', 'xiyu.news Feed Collection', 'Deploy Docs']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '13 1-15 * * *' # Hourly backup; Worker checks due queues every 5 min.
  workflow_dispatch:
    inputs:
      queue_only:
        description: 'External scheduler: check persisted queue without forced edition sync'
        type: boolean
        default: false
      edition_date:
        description: 'Optional YYYY-MM-DD for explicit historical catch-up'
        type: string
        default: ''

concurrency:
  group: bmtnews-square-distribution
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: >-
      ${{ vars.SQUARE_ENABLED == 'true' &&
          (github.event_name != 'workflow_run' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ${{ fromJSON(vars.XIYUNEWS_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main # Never execute triggering-run artifacts or untrusted branch code.
          filter: blob:none
          sparse-checkout: |
            src
            data
      - name: Restore isolated delivery queue
        env:
          EDITION_DATE: ${{ inputs.edition_date }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git init "$RUNNER_TEMP/square-state"
          git -C "$RUNNER_TEMP/square-state" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$RUNNER_TEMP/square-state" config user.name 'github-actions[bot]'
          git -C "$RUNNER_TEMP/square-state" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Network/auth errors must not be interpreted as an empty queue.
          refs=$(git ls-remote --heads origin refs/heads/square-queue)
          if [ -n "$refs" ]; then
            git -C "$RUNNER_TEMP/square-state" fetch --depth=1 origin square-queue
            git -C "$RUNNER_TEMP/square-state" checkout -b square-queue FETCH_HEAD
            test -f "$RUNNER_TEMP/square-state/queue.json"
          else
            git -C "$RUNNER_TEMP/square-state" checkout --orphan square-queue
          fi
      - name: Queue-only gate (no dependencies or edition read)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
          EDITION_DATE: ${{ inputs.edition_date }}
          QUEUE_ONLY: ${{ inputs.queue_only }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--queue "$RUNNER_TEMP/square-state/queue.json" --date "$EDITION_DATE")
          if { [ "$EVENT_NAME" = workflow_dispatch ] && [ "$QUEUE_ONLY" != true ]; } ||
             { [ "$EVENT_NAME" = workflow_run ] && [ "$UPSTREAM_NAME" != 'xiyu.news X Distribution' ]; }; then
            args+=(--force-sync)
          fi
          python3 -m src.square_plan "${args[@]}" | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"
      - name: Read edition only on publication, revision or bootstrap
        if: steps.gate.outputs.sync == 'true'
        env:
          EDITION_DATE: ${{ inputs.edition_date }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          edition_path=api/latest.json
          if [ -n "$EDITION_DATE" ]; then
            [[ "$EDITION_DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
            edition_path="editions/$EDITION_DATE/edition.json"
          fi
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/$edition_path?ref=gh-pages" \
            > "$RUNNER_TEMP/square-edition-download.json"
          python3 -c 'import json,sys; value=json.load(open(sys.argv[1])); sys.exit(0 if isinstance(value,dict) and isinstance(value.get("items"),list) and isinstance(value.get("date"),str) else "Invalid published edition")' "$RUNNER_TEMP/square-edition-download.json"
          cp "$RUNNER_TEMP/square-edition-download.json" "$RUNNER_TEMP/square-edition.json"
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.sync == 'true' || steps.gate.outputs.due == 'true'
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        if: steps.gate.outputs.sync == 'true' || steps.gate.outputs.due == 'true'
        with:
          version: '0.11.32'
      - run: uv sync --frozen
        if: steps.gate.outputs.sync == 'true' || steps.gate.outputs.due == 'true'
      - name: Publish due stories with remote checkpoints
        if: steps.gate.outputs.sync == 'true' || steps.gate.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SQUARE_ENABLED: ${{ vars.SQUARE_ENABLED }}
          BINANCE_SQUARE_OPENAPI_KEY: ${{ secrets.BINANCE_SQUARE_OPENAPI_KEY }}
          EDITION_DATE: ${{ inputs.edition_date }}
          SYNC_EDITION: ${{ steps.gate.outputs.sync }}
        shell: bash
        run: |
          args=(--queue-dir "$RUNNER_TEMP/square-state" --edition-date "$EDITION_DATE")
          if [ "$SYNC_EDITION" = true ]; then args+=(--edition "$RUNNER_TEMP/square-edition.json"); fi
          uv run python -m src.square_delivery "${args[@]}"
      - name: Flag unresolved or unscheduled posts
        if: steps.gate.outputs.attention != '0' || steps.gate.outputs.unscheduled != '0'
        run: exit 1
