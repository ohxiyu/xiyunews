name: xiyu.news Schedule Watchdog

# Avoid the observed HTTP/2 CANCEL/early-EOF downloads. Process-local only;
# never change server Git config or credentials.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1

on:
  schedule:
    # UTC schedules: 07:43, then hourly 08:17-15:17 in Asia/Shanghai.
    # Repeated checks recover when either scheduler drops or delays one event.
    - cron: '43 23 * * *'
    - cron: '17 0-7 * * *'
  workflow_dispatch:

concurrency:
  group: bmtnews-schedule-watchdog
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ${{ fromJSON(vars.XIYUNEWS_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout: src

      - name: Check daily edition heartbeat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_CHECK_TOKEN: ${{ secrets.RECOVERY_CHECK_TOKEN }}
          XIYUNEWS_RECOVERY_CHECK_TOKEN: ${{ secrets.XIYUNEWS_RECOVERY_CHECK_TOKEN }}
          XIYUNEWS_EDGE_ENABLED: ${{ vars.XIYUNEWS_EDGE_ENABLED }}
        run: >-
          python3 -m src.schedule_watchdog
          --coordinator
          --repository "${GITHUB_REPOSITORY}"
          --workflow daily-summary.yml
          --ref main
          --timezone Asia/Shanghai
          --cutoff-hour 7
          --grace-minutes 43
