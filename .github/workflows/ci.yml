name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'
  WRANGLER_HIDE_BANNER: 'true'
  EDITION_SNAPSHOT: 9cf037ee185b007e37181daf181649b4c834d275

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EDITION_SNAPSHOT }}
          path: .edition-snapshot
          persist-credentials: false
          sparse-checkout: |
            _posts
            editions
            api/latest.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/check-upstream.mjs

  realtime:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: realtime
    env:
      TELEGRAM_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python -m pytest
      - run: python scripts/check_repository.py --base origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test scripts/deploy/watchdog/watchdog.test.mjs
