name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  edge-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: .edge-source
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: bundle exec jekyll build --source .edge-source --destination .edge-rendered
      - run: python3 scripts/prepare_edge_assets.py .edge-rendered .edge-site
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
        working-directory: ops/daily-dispatcher
      - run: npx wrangler deploy --config wrangler.unified.jsonc --dry-run
        working-directory: ops/daily-dispatcher
  realtime-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.paths.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" -- realtime/ .github/workflows/ci.yml | grep -q .; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
  realtime:
    needs: realtime-paths
    if: needs.realtime-paths.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: realtime
    env:
      TELEGRAM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python -m pytest
      - run: python -m compileall -q src run.py
      - run: python scripts/check_repository.py --base origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node --test scripts/deploy/watchdog/watchdog.test.mjs
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check versions, handoff, document links and PR evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_governance.py --base "$BASE_SHA" --head "$HEAD_SHA"
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest
      - run: uv export --all-extras --no-dev --no-hashes --no-emit-project --output-file "${RUNNER_TEMP}/requirements.txt"
      - name: Audit dependencies (fall back to OSV when PyPI is down)
        shell: bash
        run: |
          # A vulnerability finding fails at once. Only an outage of the
          # vulnerability service (pip-audit ServiceError, HTTP 5xx, network)
          # moves on: PyPI, then the independent OSV database, then PyPI again,
          # so an outage of one backend cannot block an unrelated change.
          services=(pypi osv pypi)
          for attempt in 0 1 2; do
            service="${services[$attempt]}"
            if uvx --from pip-audit==2.10.1 pip-audit --requirement "${RUNNER_TEMP}/requirements.txt" --no-deps --disable-pip --progress-spinner off --vulnerability-service "$service" 2>&1 | tee "${RUNNER_TEMP}/pip-audit.log"; then
              echo "pip-audit passed using $service"
              exit 0
            fi
            if ! grep -qE 'ServiceError|ConnectionError|ProxyError|ReadTimeout|5[0-9][0-9] Server Error' "${RUNNER_TEMP}/pip-audit.log"; then
              exit 1
            fi
            echo "::warning::pip-audit could not reach the $service vulnerability service"
            if [ "$attempt" -lt 2 ]; then
              sleep 20
            fi
          done
          echo "::error::pip-audit could not reach PyPI or OSV"
          exit 1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ops/daily-dispatcher/package-lock.json
      - run: npm ci
        working-directory: ops/daily-dispatcher
      - run: npm run check
        working-directory: ops/daily-dispatcher
      - run: node --check docs/_worker.js
      - run: node --test tests/test_agent_worker.mjs
      - run: node --test tests/test_admin_worker.mjs
      - run: node --test tests/test_brand_redirect.mjs
      - run: node --test tests/test_story_card.mjs
      - run: node --test tests/test_reading_context.mjs
      - run: node --test tests/test_feed_schedule.mjs
      - run: node --test tests/test_pwa_*.mjs
