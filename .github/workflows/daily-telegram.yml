name: xiyunews Daily Telegram
env:
  XIYUNEWS_STATE_BACKEND: ${{ vars.XIYUNEWS_RUNTIME_MODE == 'hosted' && 'cloudflare' || '' }}
on:
  workflow_run:
    workflows: ['xiyunews Cloudflare']
    types: [completed]
    branches: [main]
concurrency:
  group: xiyunews-core-telegram
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  deliver:
    if: vars.XIYUNEWS_RUNTIME_MODE != 'maintenance' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ${{ vars.XIYUNEWS_RUNTIME_MODE == 'hosted' && 'ubuntu-latest' || fromJSON(vars.XIYUNEWS_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Read exact verified deployment evidence
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: production-edition
          path: deployment-proof
      - name: Check whether this deployment published a daily edition
        id: publication
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          proof=json.loads(Path('deployment-proof/production-edition.json').read_text())
          run=str(proof.get('source_run_id') or '')
          if run and not run.isdecimal():raise ValueError('invalid source run identity')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('deliver='+str(bool(run and proof.get('verified') is True)).lower()+'\n')
              out.write('source_run_id='+run+'\n')
          PYCODE
      - uses: actions/checkout@v6
        if: steps.publication.outputs.deliver == 'true'
        with:
          ref: gh-pages
          path: published
          sparse-checkout: _data/bmtnews_state.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v7
        if: steps.publication.outputs.deliver == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.publication.outputs.source_run_id }}
          pattern: run-report-*
          path: source-report
      - uses: astral-sh/setup-uv@v7
        if: steps.publication.outputs.deliver == 'true'
        with:
          version: '0.11.32'
      - run: uv sync --frozen
        if: steps.publication.outputs.deliver == 'true'
      - name: Acquire private fenced publication state
        id: state
        if: env.XIYUNEWS_STATE_BACKEND == 'cloudflare' && steps.publication.outputs.deliver == 'true'
        run: python3 -m src.edge_state acquire
      - name: Send eligible new Chinese edition with durable one-shot receipt
        if: steps.publication.outputs.deliver == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: uv run python -m src.core_delivery

      - name: Alert an unconfirmed Telegram delivery without retrying it
        if: ${{ always() && failure() && steps.publication.outputs.deliver == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID || vars.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_ALERT_THREAD_ID: ${{ secrets.TELEGRAM_ALERT_THREAD_ID || vars.TELEGRAM_ALERT_THREAD_ID }}
        shell: bash
        run: |
          mapfile -t reports < <(find source-report -name run-report.json -type f 2>/dev/null)
          report="${reports[0]:-data/no-producer-report.json}"
          uv run python -m src.operations --report "$report" --workflow-status failure

      - name: Release private publication state
        if: always() && steps.state.outcome == 'success'
        run: python3 -m src.edge_state release
