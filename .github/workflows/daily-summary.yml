name: xiyu.news Daily Edition

# Avoid the observed HTTP/2 CANCEL/early-EOF downloads. Process-local only;
# never change server Git config or credentials.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1
run-name: >-
  Daily ${{ inputs.edition_date || 'auto' }}
  via ${{ inputs.trigger_source || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Read-only cached dedup diagnosis, at most twelve model calls, no publication
        type: boolean
        default: false
      diagnostic_batch:
        description: Optional comma-separated sanitized fingerprints for targeted diagnosis
        type: string
        default: ''
      edition_date:
        description: Local edition date ending at 07:00 Asia/Shanghai (YYYY-MM-DD)
        type: string
        required: false
        default: ''
      trigger_source:
        description: Dispatcher identity for run observability
        type: string
        required: false
        default: manual
      cutoff_hour:
        description: Use 7 for new editions; 8 only for explicitly authorized legacy edition rebuilds
        type: choice
        options: ['7', '8']
        default: '7'
      force_publish:
        description: Rebuild an already published fixed window
        type: boolean
        required: false
        default: false

concurrency:
  group: bmtnews-feed-update
  cancel-in-progress: false

jobs:
  dedup-diagnostic:
    if: ${{ inputs.diagnostic_only }}
    runs-on: ${{ fromJSON(vars.XIYUNEWS_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require isolated agent branch (no main workflow_run delivery)
        env:
          TASK_REF: ${{ github.ref }}
        run: '[[ "$TASK_REF" == refs/heads/agent/* ]]'
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.32'
      - run: uv sync --frozen
      - uses: actions/cache/restore@v5
        with:
          path: |
            data/staging-items.json
            data/analysis-cache.json
            data/qualified-cache.json
          key: diagnostic-read-only-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-bmtnews-pipeline-v2-
      - name: Read public state
        run: |
          git fetch --depth=1 origin +main:refs/remotes/origin/main +gh-pages:refs/remotes/origin/gh-pages
      - name: Bounded sanitized dedup diagnosis
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          DIAGNOSTIC_BATCH: ${{ inputs.diagnostic_batch }}
        run: |
          args=()
          if [ -n "$DIAGNOSTIC_BATCH" ]; then args+=(--batch-id "$DIAGNOSTIC_BATCH"); fi
          uv run python -m scripts.diagnose_dedup "${args[@]}"
  daily-summary:
    if: ${{ !inputs.diagnostic_only }}
    runs-on: ${{ fromJSON(vars.XIYUNEWS_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout: |
            src
            docs
            scripts
            ops
            data
            .github

      - name: Restore published daily state and archive
        shell: bash
        run: |
          git fetch --depth=1 origin +gh-pages:refs/remotes/origin/gh-pages
          if git cat-file -e "origin/gh-pages:_data/bmtnews_state.json" 2>/dev/null; then
            mkdir -p docs/_data
            git show "origin/gh-pages:_data/bmtnews_state.json" > docs/_data/bmtnews_state.json
          fi
          # Four-hour collection runs own the current event catalog. Restore
          # it before the daily edition assigns exact event/update links.
          for path in _data/events.json _data/event-legacy-urls.json; do
            if git cat-file -e "origin/gh-pages:${path}" 2>/dev/null; then
              git show "origin/gh-pages:${path}" > "docs/${path}"
            fi
          done
          # The cross-day archive powers threads, entity pages, and the API.
          mkdir -p docs/_data/archive
          for path in $(git ls-tree -r --name-only origin/gh-pages -- _data/archive 2>/dev/null); do
            git show "origin/gh-pages:${path}" > "docs/${path}"
          done

      - name: Restore staged source items
        uses: actions/cache/restore@v5
        with:
          path: |
            data/staging-items.json
            data/analysis-cache.json
            data/qualified-cache.json
          key: ${{ runner.os }}-bmtnews-pipeline-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-bmtnews-pipeline-v2-
            ${{ runner.os }}-bmtnews-staging-v1-

      - name: Merge latest persistent staging with the restored cache
        shell: bash
        run: |
          if git fetch --depth=1 origin staging-cache 2>/dev/null; then
            mkdir -p data
            if [ ! -f data/staging-items.json ]; then
              git show FETCH_HEAD:data/staging-items.json > data/staging-items.json 2>/dev/null || rm -f data/staging-items.json
            fi
            if [ ! -f data/analysis-cache.json ]; then
              git show FETCH_HEAD:data/analysis-cache.json > data/analysis-cache.json 2>/dev/null || rm -f data/analysis-cache.json
            fi
            if [ ! -f data/qualified-cache.json ]; then
              git show FETCH_HEAD:data/qualified-cache.json > data/qualified-cache.json 2>/dev/null || rm -f data/qualified-cache.json
            fi
            python3 scripts/merge_pipeline_cache.py FETCH_HEAD
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - name: Install dependencies
        run: uv sync --frozen --extra trafilatura

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Restore durable publication documents before rendering
        run: uv run python -m src.publication_state --restore-published


      - name: Run xiyu.news
        env:
          # Map secrets to environment variables expected by config.json
          # Modify these based on your data/config.github.json provider settings
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          EDITION_CUTOFF_HOUR: ${{ inputs.cutoff_hour || '7' }}
        shell: bash
        run: |
          args=(--mode publish --hours 24 --cutoff-hour "$EDITION_CUTOFF_HOUR")
          if [ -n "${{ inputs.edition_date }}" ]; then
            args+=(--edition-date "${{ inputs.edition_date }}")
          fi
          if [ "${{ inputs.force_publish }}" = "true" ]; then
            args+=(--force-publish)
          fi
          uv run bmtnews "${args[@]}"

      - name: Preserve successful AI work even after publication failure
        if: ${{ always() }}
        uses: actions/cache/save@v5
        with:
          path: |
            data/staging-items.json
            data/analysis-cache.json
            data/qualified-cache.json
          key: ${{ runner.os }}-bmtnews-pipeline-v2-${{ github.run_id }}-${{ github.run_attempt }}


      - name: Read published edition date
        id: edition
        shell: bash
        run: |
          edition_date="$(python -c 'import json; print(json.load(open("data/run-report.json", encoding="utf-8"))["date"])')"
          echo "date=${edition_date}" >> "$GITHUB_OUTPUT"

      - name: Repair retained edition history without AI or delivery
        run: uv run python -m src.edition_recovery


      - name: Rebuild core reader from published content without AI or delivery
        run: uv run python -m src.core_site --root docs --stage-reader reader-output

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reader-output
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ steps.edition.outputs.date }}"
          publish_branch: gh-pages
          enable_jekyll: true

      - name: Confirm exact published state checkpoint
        run: uv run python -m src.publication_state --acknowledge-published --reader-only

      - name: Finalize private operational alerts and costs
        if: ${{ always() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          OPERATIONS_STATUS: ${{ job.status }}
        run: uv run python -m src.operations --workflow-status "$OPERATIONS_STATUS"

      - name: Publish run report
        if: ${{ always() }}
        run: python3 -m src.run_report --input data/run-report.json --output "$GITHUB_STEP_SUMMARY"

      - name: Keep machine-readable cost and health report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: run-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/run-report.json
          retention-days: 30
          if-no-files-found: warn
