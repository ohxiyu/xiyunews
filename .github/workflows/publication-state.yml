name: xiyunews State Maintenance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bmtnews-feed-update
  cancel-in-progress: false
jobs:
  state:
    if: github.ref == 'refs/heads/main' && vars.XIYUNEWS_RUNTIME_MODE == 'tokyo' && vars.XIYUNEWS_RUNNER_LABELS != ''
    runs-on: ${{ fromJSON(vars.XIYUNEWS_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.32'
      - run: uv sync --frozen
      - name: Read immutable audit snapshots without changing any branches
        run: |
          git fetch --depth=1 origin +gh-pages:refs/remotes/origin/gh-pages +staging-cache:refs/remotes/origin/staging-cache +x-queue:refs/remotes/origin/x-queue +square-queue:refs/remotes/origin/square-queue
          mkdir .state-snapshot
          for name in staging-items.json analysis-cache.json; do
            git show "origin/staging-cache:data/$name" > ".state-snapshot/$name"
          done
          for name in events.json event-legacy-urls.json bmtnews_state.json; do
            git show "origin/gh-pages:_data/$name" > ".state-snapshot/$name"
          done
          git show origin/x-queue:data/x-queue.json > .state-snapshot/x-queue.json
          git show origin/square-queue:queue.json > .state-snapshot/square-queue.json
      - name: Bootstrap only missing state, prove exact contents and integrity, never publish
        run: uv run python -m src.publication_state --bootstrap .state-snapshot
