name: xiyu.news Runtime Migration
# One-time live state transfer and read-only acceptance. Never sends or runs AI.
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [migrate, verify]
        default: verify
permissions:
  contents: read
  id-token: write
concurrency:
  group: xiyunews-runtime-migration
  cancel-in-progress: false
jobs:
  state:
    if: github.ref == 'refs/heads/main' && (inputs.mode != 'migrate' || vars.XIYUNEWS_RUNTIME_MODE == 'maintenance')
    runs-on: ${{ inputs.mode == 'migrate' && fromJSON('["self-hosted","Linux","X64","xiyunews-tokyo"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: src
          persist-credentials: false
      - name: Transfer frozen live state without a retained backup
        if: inputs.mode == 'migrate'
        run: python3 -m src.edge_state migrate --source /home/xiyunews-runner/state/publication.sqlite3
      - name: Acquire and verify the hosted state
        if: inputs.mode == 'verify'
        run: |
          python3 -m src.edge_state acquire
          python3 -m src.edge_state verify
      - name: Release state lease
        if: always()
        run: python3 -m src.edge_state release
