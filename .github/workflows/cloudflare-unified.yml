name: xiyunews Cloudflare

on:
  push:
    branches: [main]
    paths: ['site/**', 'edge/**', 'scripts/build.mjs', 'package*.json', 'wrangler.json', 'realtime/scripts/deploy/watchdog/worker.js', '.github/workflows/cloudflare-unified.yml']
  workflow_dispatch:

concurrency:
  group: xiyunews-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'
  WRANGLER_HIDE_BANNER: 'true'
  EDITION_SNAPSHOT: 9cf037ee185b007e37181daf181649b4c834d275

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && vars.XIYUNEWS_EDGE_ENABLED == 'true' && vars.XIYUNEWS_RUNTIME_MODE != 'maintenance'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.EDITION_SNAPSHOT }}
          path: .edition-snapshot
          persist-credentials: false
          sparse-checkout: |
            _posts
            editions
            api/latest.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify public news, details and browser access before deployment
        run: node scripts/check-upstream.mjs
      - name: Deploy existing Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm exec wrangler -- deploy --keep-vars --var "SITE_SOURCE_COMMIT:$GITHUB_SHA"
      - name: Verify the deployed reader and its archive
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { setTimeout } from 'node:timers/promises';
          const site = 'https://xiyu.news';
          async function get(path) {
            const response = await fetch(site + path, {signal: AbortSignal.timeout(10000)});
            assert.equal(response.status, 200, path);
            return response;
          }
          for (let attempt = 1; attempt <= 6; attempt++) {
            try {
              assert.equal((await (await get('/health')).json()).commit, process.env.GITHUB_SHA);
              assert.match(await (await get('/')).text(), /MARKET WIRE/);
              assert.match(await (await get('/history/')).text(), /2026-11-20/);
              assert.match(await (await get('/2026/07/26/summary-zh.html')).text(), /id="item-1"/);
              assert.match(await (await get('/2026/11/20/summary-zh.html')).text(), /id="zh-2026-11-20-item-1"/);
              break;
            } catch (error) {
              if (attempt === 6) throw error;
              await setTimeout(5000);
            }
          }
          JS
