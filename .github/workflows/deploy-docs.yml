name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/site_pages.py'
      - 'src/core_site.py'
      - 'scripts/overlay_core_site.py'
      - 'src/tracking_republish.py'
      - 'src/threads.py'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: bmtnews-feed-update
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ fromJSON(vars.XIYUNEWS_RUNNER_LABELS || '["ubuntu-latest"]') }}
    # The two checkouts plus the publisher clone exhausted 20 minutes twice
    # after saving the recovered snapshot but before its exact checkpoint ACK.
    # Match the bounded edge-build/deploy budget without removing any checks.
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout current published site
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: current-site
          persist-credentials: false

      - name: Restore current published archive
        shell: bash
        run: |
          test -d current-site/_data/archive
          mkdir -p docs/_data/archive
          cp -a current-site/_data/archive/. docs/_data/archive/
          # Rebuild only the reader index from the live, validated catalog.
          # Never replace it with the old checked-in migration fixture.
          test -f current-site/_data/events.json
          cp current-site/_data/events.json docs/_data/events.json
          # Preserve generated API/history and migrate only owned URL prefixes.
          for directory in _posts api editions feeds; do
            if [ -d "current-site/$directory" ]; then
              mkdir -p "docs/$directory"
              cp -a "current-site/$directory/." "docs/$directory/"
            fi
          done
          if [ -f current-site/sitemap.xml ]; then
            cp current-site/sitemap.xml docs/sitemap.xml
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Restore durable publication documents before rendering
        run: uv run python -m src.publication_state --restore-published

      - name: Repair retained edition history without AI or delivery
        run: uv run python -m src.edition_recovery


      - name: Rebuild core reader from published content without AI or delivery
        run: uv run python -m src.core_site --root docs --stage-reader reader-output

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reader-output
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
          commit_message: >-
            ${{ github.event_name == 'workflow_dispatch'
                && format('chore: import published history from {0}@{1}', inputs.history_repository, inputs.history_sha)
                || github.event.head_commit.message }}

      - name: Confirm exact published state checkpoint
        run: uv run python -m src.publication_state --acknowledge-published --reader-only
